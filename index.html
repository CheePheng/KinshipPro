<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pheng Kinship</title>
    
    <!-- PWA / Mobile App Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Pheng Kinship">
    <meta name="theme-color" content="#e11d48">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafaf9;
            background-image: 
                radial-gradient(at 0% 0%, hsla(341, 100%, 98%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(221, 100%, 98%, 1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(142, 100%, 98%, 1) 0, transparent 50%),
                radial-gradient(at 0% 100%, hsla(35, 100%, 98%, 1) 0, transparent 50%);
            background-attachment: fixed;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide scrollbar but allow scrolling */
        ::-webkit-scrollbar {
            display: none;
        }
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        @keyframes result-spring {
            0% { 
                transform: scale(0.6) translateY(30px) rotate(-8deg); 
                opacity: 0; 
                filter: blur(12px); 
            }
            50% { 
                transform: scale(1.15) translateY(-8px) rotate(3deg); 
                opacity: 1;
                filter: blur(0px);
            }
            75% { 
                transform: scale(0.95) translateY(4px) rotate(-1deg); 
            }
            100% { 
                transform: scale(1) translateY(0) rotate(0deg); 
                opacity: 1; 
                filter: blur(0); 
            }
        }
        .animate-result {
            will-change: transform, opacity, filter;
            animation: result-spring 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
<script type="importmap">
{

    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>

</body>
</html>
